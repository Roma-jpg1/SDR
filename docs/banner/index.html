<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>SDR — orbital banner</title>
  <script src="node_modules/gsap/dist/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { font-family: sans-serif; color: #eef6ff; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #070e1b; }
    .backdrop { position: absolute; inset: 0; background: radial-gradient(ellipse at 76% 49%, #102d47 0%, #0b192b 28%, #070e1b 65%); }
    .clip, .overlay { position: absolute; inset: 0; }
    #space { display: block; width: 100%; height: 100%; }
    .copy { position: absolute; left: 64px; top: 59px; width: 525px; }
    .eyebrow { margin: 0; color: #a1b5cb; font-size: 12px; font-weight: 600; letter-spacing: 2.3px; }
    h1 { margin: 22px 0 0; font-size: 112px; line-height: 1; letter-spacing: -6px; font-weight: 800; }
    h1 span { color: #67e1e8; }
    .subtitle { margin: 17px 0 0; font-size: 24px; font-weight: 400; letter-spacing: .1px; color: #d3e1ee; }
    #waveform { position: absolute; left: 64px; top: 276px; width: 455px; height: 45px; }
    .tools { position: absolute; left: 64px; bottom: 51px; display: flex; gap: 22px; font-family: monospace; font-size: 12px; letter-spacing: .4px; color: #9ab4cd; }
    .tools span + span::before { content: '/'; margin-right: 22px; color: #526d84; }
    .status { position: absolute; right: 44px; bottom: 26px; display: flex; align-items: center; gap: 8px; color: #a9c0d2; font-family: monospace; font-size: 10px; letter-spacing: 1.8px; }
    #signal-dot { width: 5px; height: 5px; border-radius: 50%; background: #6ae4de; box-shadow: 0 0 9px #46d8dc88; }
    .frame { position: absolute; inset: 13px; border: 1px solid #829ab019; border-radius: 10px; pointer-events: none; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="satellites" data-start="0" data-duration="8" data-width="1200" data-height="400">
    <div class="backdrop"></div>
    <canvas id="space" class="clip" width="1200" height="400" data-start="0" data-duration="8" data-track-index="0" data-layout-ignore></canvas>
    <section id="typography" class="overlay">
      <div class="copy">
        <p class="eyebrow">ПРОИЗВОДСТВЕННАЯ ПРАКТИКА</p>
        <h1>SDR<span>.</span></h1>
        <p class="subtitle">Цифровая радиосвязь</p>
      </div>
      <svg id="waveform" viewBox="0 0 455 45" fill="none" data-layout-ignore>
        <path d="M0 22.5 H455" stroke="#183349"/>
        <path id="wave" stroke="#6bdfe2" stroke-width="1.2" opacity=".9"/>
      </svg>
      <div class="tools"><span>ADALM-PLUTO</span><span>GNU RADIO</span><span>SoapySDR</span></div>
      <div class="status"><i id="signal-dot"></i><span>RX / TX</span></div>
      <div class="frame" data-layout-ignore></div>
    </section>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to('#signal-dot', { opacity: .32, duration: 1, repeat: 7, yoyo: true, ease: 'sine.inOut' }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines.satellites = tl;
  </script>
  <script type="module">
    import * as THREE from './node_modules/three/build/three.module.js';
    import { createScene } from './scene.js';
    const renderAt = createScene(THREE);
    window.addEventListener('hf-seek', event => renderAt(event.detail.time));
    window.renderBannerAt = renderAt;
    renderAt(0);
  </script>
</body>
</html>
